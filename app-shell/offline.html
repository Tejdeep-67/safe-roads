<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Safe Roads</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, -apple-system, Roboto, sans-serif;
         background: #fff; color: #1f2328; text-align: center; padding: 24px; box-sizing: border-box; }
  @media (prefers-color-scheme: dark) { body { background: #202227; color: #e8eaed; } p { color: #a3a9b3 !important; } }
  .logo { width: 72px; height: 72px; margin: 0 auto 20px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { margin: 0 auto 24px; max-width: 300px; color: #5f6672; line-height: 1.5; font-size: 15px; }
  button { border: 0; border-radius: 999px; background: #2557d6; color: #fff; font: 600 15px system-ui, sans-serif; padding: 12px 28px; }
</style>
</head>
<body>
  <main>
    <div class="logo"><svg viewBox="0 0 64 64" width="72" height="72"><rect width="72" height="72" rx="15" fill="#2557d6"/><path d="M19 64C19 44 45 38 45 0" fill="none" stroke="#fff" stroke-width="17"/><path d="M19 64C19 44 45 38 45 0" fill="none" stroke="#2557d6" stroke-width="2.4" stroke-dasharray="5 6" stroke-dashoffset="2"/><ellipse cx="40" cy="35.8" rx="5.4" ry="3.1" transform="rotate(-58 40 35.8)" fill="#f26b1d"/></svg></div>
    <h1>No internet connection</h1>
    <p>Safe Roads needs the internet for the map, search and reports. Check your mobile data or Wi-Fi and try again.</p>
    <button onclick="location.href='https://thesaferoads.netlify.app/'">Try again</button>
  </main>
  <script>
    // come back on our own as soon as the phone is online again
    window.addEventListener('online', () => (location.href = 'https://thesaferoads.netlify.app/'));
  </script>
</body>
</html>
