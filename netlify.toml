[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "20"

# Cross-origin isolation lets onnxruntime-web use multi-threaded WASM.
# "credentialless" (instead of require-corp) still allows the map tiles and
# Nominatim/OSRM requests, which don't send CORP headers.
[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "credentialless"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), geolocation=(self), microphone=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"

[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
    Content-Type = "application/octet-stream"

[[headers]]
  for = "/demo/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# SPA fallback (the function has its own /api/hazards path so it is not affected)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
